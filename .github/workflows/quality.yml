name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m playwright install --with-deps chromium
      - run: uv run --frozen ruff check platform_app tests scripts migrations/versions/eb8f0a7d36c4_tenant_inference_quotas.py
      - run: uv run --frozen python -m pytest -q
      - run: uv run --frozen python -m scripts.validate_benchmark --manifest benchmarks/suite-v1.json
      - run: uv run --frozen python -m scripts.verify_benchmark_cases

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aip
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: aip
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U aip -d aip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AIP_DATABASE_URL: postgresql+psycopg://aip:local_only@127.0.0.1:54329/aip
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m alembic upgrade head
      - run: uv run --frozen python -m alembic check
      - run: uv run --frozen python -m scripts.verify_postgres_admission

  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.20'
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: docker build -f infra/dev-sandbox/Dockerfile -t aip-dev-sandbox:0.1.0 .
      - run: uv run --frozen python -m scripts.verify_development_worker --runtime native --controlled-provider
