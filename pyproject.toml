[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "cryptography>=45,<47",
  "langgraph>=0.6,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "playwright>=1.54,<2",
  "boto3>=1.40,<2",
  "alembic>=1.16,<2",
  "pyjwt[crypto]>=2.15,<3",
  "opentelemetry-api>=1.40,<2",
  "opentelemetry-sdk>=1.40,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.setuptools.packages.find]
include = ["platform_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
